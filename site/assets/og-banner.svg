<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">RuleDSL — Executable Business Policies</title>
  <desc id="description">RuleDSL positioning banner: deterministic, versioned and replayable.</desc>
  <defs>
    <radialGradient id="accentGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(955 135) rotate(142) scale(520 355)">
      <stop offset="0" stop-color="#6c8cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6c8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(185 545) rotate(-28) scale(410 240)">
      <stop offset="0" stop-color="#5ddbd1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5ddbd1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0f1117"/>
  <rect width="1200" height="630" fill="url(#accentGlow)"/>
  <rect width="1200" height="630" fill="url(#tealGlow)"/>
  <rect x="96" y="96" width="6" height="438" rx="3" fill="#7f9cff"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="132" y="166" fill="#7f9cff" font-size="52" font-weight="700" letter-spacing="-1">RuleDSL</text>
    <text x="132" y="305" fill="#eef0f6" font-size="78" font-weight="700" letter-spacing="-2.4">Executable Business</text>
    <text x="132" y="397" fill="#eef0f6" font-size="78" font-weight="700" letter-spacing="-2.4">Policies</text>
    <text x="132" y="501" fill="#5ddbd1" font-size="34" font-weight="600" letter-spacing="0.4">Deterministic · Versioned · Replayable</text>
  </g>
</svg>
